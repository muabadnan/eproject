<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box {
        margin: 0px auto;
        height: 100px;
        width: 70%;
        border: 4px solid black;
    }

    #colorbox {
        height: 100px;

    }
</style>

<body>
    <label>subject 11:</label> <br>
    <input type="number" id="v1">
    <br> <br>

    <label>subject 12:</label> <br>
    <input type="number" id="v2">
    <br> <br>

    <label>subject 13:</label> <br>
    <input type="number" id="v3">
    <br> <br>

    <button onClick="showresult()"> Result </button>
    <br><br>
    <center>
        <p id="result">
            the result will be displayed here
        </p>
    </center>
    <div class="box">
        <div id="colorbox">

        </div>
    </div>
    <script>
        function showresult() 
        {
            sub1 = parseInt(document.getElementById('v1').value)
            sub2 = parseInt(document.getElementById('v2').value)
            sub3 = parseInt(document.getElementById('v3').value)

            total = sub1 + sub2 + sub3
            p = total / 300 * 100
            document.getElementById('result').innerHTML = "your total marks are " + total +
                "and your percentage is " + p
            if (p >= 80) 
            {
                document.getElementById('colorbox').style.width = p+"%"
                document.getElementById('colorbox').style.backgroundColor = "green"
            }

            else if (p >= 40) {
                document.getElementById('colorbox').style.width = p+"%"
                document.getElementById('colorbox').style.backgroundColor = "orange"
            }
            else {
                document.getElementById('colorbox').style.width = p+"%"
                document.getElementById('colorbox').style.backgroundColor = "red"
            }
        }
    </script>
</body>


</html>
